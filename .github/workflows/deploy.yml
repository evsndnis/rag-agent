name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Prepare image name
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$OWNER_LOWER/rag-agent" >> $GITHUB_ENV

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # команды ниже выполняются НА сервере
            # логинимся в реестр, чтобы стянуть приватный образ
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # тянем образ, который CI уже собрал и проверил тестами
            docker pull ${{ env.IMAGE }}:latest

            # сносим старый контейнер, если был
            docker rm -f rag-agent 2>/dev/null || true

            # поднимаем новый в фоне; qdrant на сервере поднят и обновляется отдельно,
            # но должен быть в той же сети rag-net, чтобы был доступен по http://qdrant:6333.
            # OpenRouter блокирует IP из РФ: HTTPS-трафик (LLM, HF Hub) идёт через прокси
            # на зарубежном VPS; qdrant и localhost — напрямую
            docker run -d \
              --name rag-agent \
              --restart unless-stopped \
              --network rag-net \
              -p 127.0.0.1:8002:8000 \
              -e LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
              -e HTTPS_PROXY=${{ secrets.LLM_PROXY_URL }} \
              -e NO_PROXY=qdrant,localhost,127.0.0.1 \
              ${{ env.IMAGE }}:latest

            # убеждаемся, что контейнер действительно жив, и только тогда чистим диск
            sleep 5
            if [ -n "$(docker ps -q -f name=rag-agent -f status=running)" ]; then
              docker image prune -f
            else
              echo "Контейнер не поднялся"
              docker logs --tail 50 rag-agent
              exit 1
            fi

            docker logout ghcr.io